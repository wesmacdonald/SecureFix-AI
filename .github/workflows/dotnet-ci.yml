name: .NET CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SecureFix.slnx

      - name: Build solution
        run: dotnet build SecureFix.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SecureFix.slnx --configuration Release --no-build --verbosity normal

      - name: Scan dependencies for known vulnerabilities
        run: dotnet list SecureFix.slnx package --vulnerable --include-transitive

      - name: Build container image
        run: docker build --tag securefix-ci:${{ github.sha }} .
