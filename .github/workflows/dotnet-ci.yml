name: .NET CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/SecureFix.Web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: src/SecureFix.Web
        run: npm ci

      - name: Test dashboard
        working-directory: src/SecureFix.Web
        run: npm test

      - name: Build dashboard
        working-directory: src/SecureFix.Web
        env:
          VITE_DATA_MODE: live
          VITE_AUTH_MODE: demo
        run: npm run build

      - name: Audit dashboard production dependencies
        working-directory: src/SecureFix.Web
        run: npm audit --omit=dev --audit-level=high

      - name: Restore dependencies
        run: dotnet restore SecureFix.slnx

      - name: Build solution
        run: dotnet build SecureFix.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SecureFix.slnx --configuration Release --no-build --verbosity normal

      - name: Scan dependencies for known vulnerabilities
        run: dotnet list SecureFix.slnx package --vulnerable --include-transitive

      - name: Build container image
        run: docker build --tag securefix-ci:${{ github.sha }} .
