name: .NET CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SecureFix.slnx

      - name: Build solution
        run: dotnet build SecureFix.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SecureFix.slnx --configuration Release --no-build --verbosity normal
